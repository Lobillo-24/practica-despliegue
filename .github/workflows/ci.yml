name: CI                      # Nombre que sale en la pestaña Actions

on:                           # CUÁNDO se ejecuta
  push:                       #   cuando subes algo...
    branches: [main, develop]          #   ...a main
  pull_request:               #   cuando abres un PR...
    branches: [main,  develop]          #   ...hacia main
  workflow_dispatch:          #   y con un botón manual

jobs:                         # QUÉ trabajos hace
  test:                       # trabajo 1, se llama "test"
    runs-on: ubuntu-latest    #   en un Ubuntu limpio de GitHub
    steps:                    #   pasos, en orden:
      - uses: actions/checkout@v4       # 1. bajar tu código (el Ubuntu está vacío)
      - uses: actions/setup-node@v4     # 2. instalar Node...
        with:
          node-version: 22              #    ...versión 22
      - run: npm ci                     # 3. instalar dependencias (como tu npm install)
      - run: npm test                   # 4. pasar los tests

  docs:                       # trabajo 2, se llama "docs"
    runs-on: ubuntu-latest
    needs: test               #   solo empieza si "test" sale bien
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run docs               # generar la documentación
      - uses: actions/upload-artifact@v4   # guardarla para poder descargarla
        with:
          name: documentacion
          path: docs/